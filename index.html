<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpenseIQ - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="logo">
            <h1>💰 ExpenseIQ</h1>
            <p>Smart Money Tracker</p>
        </div>

        <div id="login-box" class="auth-box">
            <h2>Welcome Back 👋</h2>
            <input type="text" id="login-username" placeholder="Username">
            <input type="password" id="login-password" placeholder="Password">
            <button onclick="login()">Login →</button>
            <p>Don't have an account?
                <span class="link" onclick="showSignup()">Sign Up</span>
            </p>
        </div>

        <div id="signup-box" class="auth-box" style="display:none;">
            <h2>Create Account 🚀</h2>
            <input type="text" id="signup-username" placeholder="Username">
            <input type="password" id="signup-password" placeholder="Password">
            <button onclick="signup()">Create Account →</button>
            <p>Already have an account?
                <span class="link" onclick="showLogin()">Login</span>
            </p>
        </div>

        <p id="auth-message" class="message"></p>
    </div>
</div>
<script src="auth.js"></script>
</body>
</html>
